<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Konversi Mata Uang</title>
</head>
<body>

    <h3>Konversi Mata Uang</h3>

    <label id="labelAsal">Dolar</label>
    <input type="number" id="nilai" placeholder="0">
    <br><br>

    <button onclick="konversi()">Konversi</button>
    <button onclick="tukar()">Tukar</button>

    <br><br>

    <label id="labelTujuan">Rupiah :</label>
    <span id="hasil">0</span>

    <script>
        const kurs = 15000;
        let mode = "dolar_ke_rupiah";

        function konversi() {
            let nilai = document.getElementById("nilai").value;

            if (nilai === "") {
                alert("Masukkan nilai!");
                return;
            }

            let hasil;

            if (mode === "dolar_ke_rupiah") {
                hasil = nilai * kurs;
            } else {
                hasil = nilai / kurs;
            }

            document.getElementById("hasil").innerText = hasil;
        }

        function tukar() {
            if (mode === "dolar_ke_rupiah") {
                mode = "rupiah_ke_dolar";
                document.getElementById("labelAsal").innerText = "Rupiah";
                document.getElementById("labelTujuan").innerText = "Dolar :";
            } else {
                mode = "dolar_ke_rupiah";
                document.getElementById("labelAsal").innerText = "Dolar";
                document.getElementById("labelTujuan").innerText = "Rupiah :";
            }

            document.getElementById("nilai").value = "";
            document.getElementById("hasil").innerText = "0";
        }
    </script>

</body>
</html>
